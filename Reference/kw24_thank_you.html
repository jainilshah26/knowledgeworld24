<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge World24 — Thank You</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#050506;--grid:#141416;--gold:#d4af37;
  --white:#fff;--muted:rgba(255,255,255,.45);
  --display:'Syne',sans-serif;--body:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.6,.01,.05,.95);
}
body{background:var(--black);color:var(--white);font-family:var(--body);overflow-x:hidden}

.sec{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px}
.sec::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:46px 46px;opacity:.4;-webkit-mask-image:radial-gradient(ellipse 55% 60% at 50% 50%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 55% 60% at 50% 50%,#000 30%,transparent 100%)}
.glow{position:absolute;width:600px;height:400px;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(212,175,55,.09) 0%,transparent 70%);pointer-events:none}

.card{position:relative;z-index:2;text-align:center;max-width:480px}

.check{width:76px;height:76px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 32px;opacity:0;transform:scale(.6);animation:pop .6s var(--ease) .1s forwards}
.check svg{width:32px;height:32px;stroke:var(--gold);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s ease .5s forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}

.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #222;padding:6px 14px;border-radius:100px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:20px;opacity:0;animation:fade .7s ease .7s forwards}
@keyframes fade{to{opacity:1}}

h1{font-family:var(--display);font-size:clamp(30px,4.5vw,46px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px;opacity:0;transform:translateY(16px);animation:up .7s var(--ease) .8s forwards}
h1 .g{color:var(--gold)}
@keyframes up{to{opacity:1;transform:translateY(0)}}

.sub{font-size:15px;font-weight:300;color:var(--muted);line-height:1.7;max-width:400px;margin:0 auto 40px;opacity:0;transform:translateY(16px);animation:up .7s var(--ease) .9s forwards}

.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;opacity:0;transform:translateY(16px);animation:up .7s var(--ease) 1s forwards}
.bp{display:inline-flex;align-items:center;gap:9px;background:var(--gold);color:#000;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:15px 28px;border-radius:6px;text-decoration:none;transition:box-shadow .3s}
.bp:hover{box-shadow:0 0 40px rgba(212,175,55,.4)}
.bs{display:inline-flex;align-items:center;color:var(--muted);font-size:13px;padding:15px 22px;border:1px solid #222;border-radius:6px;text-decoration:none;transition:all .3s}
.bs:hover{color:#fff;border-color:#333}
</style>
</head>
<body>

<section class="sec">
  <div class="glow"></div>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
    </div>
    <div class="badge">Message Received</div>
    <h1>Thanks for Reaching Out to <span class="g">Knowledge World24.</span></h1>
    <p class="sub">Our team will review your message and get back to you within 24 hours. In the meantime, feel free to explore our work.</p>
    <div class="actions">
      <a href="/" class="bp">Back to Home</a>
      <a href="/blog" class="bs">Read Our Blog</a>
    </div>
  </div>
</section>

</body>
</html>
